plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apaloran.hifitui'
    compileSdk 34

    defaultConfig {
        applicationId "com.apaloran.hifitui"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksFile = file("release-key.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "hifitui123"
                keyAlias "hifitui"
                keyPassword "hifitui123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("release-key.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Automatically sync latest index.html from repository root before building APK
tasks.register('syncWebAsset', Copy) {
    from '../../index.html'
    into 'src/main/assets'
}
preBuild.dependsOn syncWebAsset
