name: Build Linux AppImage & Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build AppImage
        run: |
          npm install
          npm run build:appimage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hifi-tui-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  build-android-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync latest index.html & Generate Signing Keystore
        run: |
          cp index.html android/app/src/main/assets/index.html
          if [ ! -f android/app/release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/release-key.jks \
              -alias hifitui \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hifitui123 -keypass hifitui123 \
              -dname "CN=apaloran, OU=HiFiTUI, O=apaloran, L=Coimbatore, S=TN, C=IN"
          fi

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/hifi-tui-1.0.0-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hifi-tui-android-APK
          path: dist/hifi-tui-1.0.0-android.apk
          if-no-files-found: error
